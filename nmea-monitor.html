<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NMEA Weather Data Test</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #17212b;
      background: #f4f7f9;
    }

    body {
      margin: 0;
      padding: 32px;
    }

    main {
      max-width: 720px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }

    .weather-table {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border: 1px solid #d9dee5;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgb(0 0 0 / 8%);
    }

    .weather-table th,
    .weather-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #d9dee5;
      text-align: left;
      vertical-align: top;
      font-size: 15px;
      line-height: 1.35;
    }

    .weather-table tr:last-child th,
    .weather-table tr:last-child td {
      border-bottom: 0;
    }

    .weather-table th {
      width: 58px;
      color: #4c5a67;
      font-weight: 700;
      text-align: center;
    }

    .weather-table .value-cell {
      font-weight: 600;
    }

    .cell-value {
      min-width: 0;
    }

    .cell-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      color: #28758a;
      opacity: 0.86;
    }

    .cell-icon .icon-accent {
      color: #d15f4f;
    }

    .wind-detail {
      color: #d9dee5;
    }

    .status {
      min-height: 20px;
      margin-top: 12px;
      color: #d9dee5;
      font-size: 14px;
    }

    .status.error {
      color: #a12622;
    }

    @media (max-width: 520px) {
      body {
        padding: 18px;
      }

      .weather-table th,
      .weather-table td {
        width: auto;
      }

      .weather-table th {
        width: 48px;
      }

      .weather-table td {
        padding-top: 12px;
      }

      .weather-table .value-cell {
        padding-top: 12px;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1 id="page-heading">NMEA Weather Data</h1>

    <table class="weather-table" aria-live="polite">
      <tbody>
        <tr>
          <th scope="row" aria-label="Local date time">
            <svg class="cell-icon" viewBox="0 0 32 32" aria-hidden="true">
              <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.4"/>
              <path d="M16 9.5v7l5 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.2 5.8 6.3 8.4M22.8 5.8l2.9 2.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </th>
          <td class="value-cell">
            <span id="local-date-time" class="cell-value">-</span>
          </td>
        </tr>
        <tr>
          <th scope="row" aria-label="Temperature">
            <svg class="cell-icon" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M14 18.2V7a4 4 0 0 1 8 0v11.2a7 7 0 1 1-8 0Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
              <path class="icon-accent" d="M18 10v11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
              <circle class="icon-accent" cx="18" cy="23" r="3.2" fill="currentColor"/>
            </svg>
          </th>
          <td class="value-cell">
            <span id="temperature" class="cell-value">-</span>
          </td>
        </tr>
        <tr>
          <th scope="row" aria-label="Wind">
            <svg class="cell-icon" viewBox="0 0 32 32" aria-hidden="true">
              <path d="M4 11h14.5a4 4 0 1 0-3.7-5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M4 17h20.5a3.5 3.5 0 1 1-3.2 4.9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
              <path d="M4 23h9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
          </th>
          <td class="value-cell">
            <span id="wind" class="cell-value">-</span>
          </td>
        </tr>
      </tbody>
    </table>

    <div id="status" class="status">Loading weather data...</div>
  </main>

  <script>
    const REFRESH_INTERVAL_MS = 10000;
    const PAGE_QUERY = new URLSearchParams(window.location.search);

    const elements = {
      pageHeading: document.getElementById("page-heading"),
      localDateTime: document.getElementById("local-date-time"),
      temperature: document.getElementById("temperature"),
      wind: document.getElementById("wind"),
      status: document.getElementById("status"),
    };

    const requestConfig = readRequestConfig();

    if (!requestConfig.org || !requestConfig.source) {
      setStatus("Add ?org=<org>&src=<source> to the page URL.", true);
    } else {
      elements.pageHeading.textContent = `NMEA Weather at ${requestConfig.org} ${requestConfig.source}`;
      updateWeather();
      setInterval(updateWeather, requestConfig.refreshIntervalMs);
    }

    async function updateWeather() {
      try {
        const weather = await fetchWeather();
        renderWeather(weather);
        setStatus(`Updated ${formatLocalDateTime(new Date())}`);
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function fetchWeather() {
      const response = await fetch(weatherUrl(requestConfig), {
        headers: { Accept: "application/json" },
      });

      if (!response.ok) {
        throw new Error(`Weather request failed: HTTP ${response.status}`);
      }

      return response.json();
    }

    function renderWeather(weather) {
      setPageTitle(weather);
      elements.localDateTime.textContent = formatWeatherTime(weather);
      elements.temperature.textContent = formatTemperature(firstValue(weather.temperature, weather.temp));
      elements.wind.innerHTML = formatWind(
        firstValue(weather.wind_strength, weather.wind_speed, weather.windSpeed),
        firstValue(weather.wind_direction, weather.windDirection),
      );
    }

    function setPageTitle(weather) {
      const org = displayValue(weather.org);
      const source = displayValue(weather.source);
      const title = org === "-" && source === "-" ? "NMEA Weather Data" : `NMEA Weather at ${org} ${source}`;

      document.title = title;
      elements.pageHeading.textContent = title;
    }

    function weatherUrl(config) {
      return `/nmea/weather/${encodeURIComponent(config.org)}/${encodeURIComponent(config.source)}`;
    }

    function readRequestConfig() {
      return {
        org: firstQueryValue("org"),
        source: firstQueryValue("src", "source"),
        refreshIntervalMs: readRefreshIntervalMs(),
      };
    }

    function firstQueryValue(...keys) {
      for (const key of keys) {
        const value = PAGE_QUERY.get(key);
        if (value && value.trim()) {
          return value.trim();
        }
      }
      return "";
    }

    function readRefreshIntervalMs() {
      const value = Number(PAGE_QUERY.get("rate"));
      if (!Number.isFinite(value) || value <= 0) {
        return REFRESH_INTERVAL_MS;
      }
      return value * 1000;
    }

    function firstValue(...values) {
      return values.find((value) => value !== null && value !== undefined && value !== "");
    }

    function formatWeatherTime(weather) {
      if (weather.utc_start && weather.utc_end) {
        return `${formatLocalDateTime(weather.utc_start)} - ${formatLocalDateTime(weather.utc_end)}`;
      }
      return formatLocalDateTime(
        firstValue(weather.local_time, weather.utc_end, weather.utc_time, weather.datetime, weather.date_time),
      );
    }

    function formatLocalDateTime(value) {
      if (!value) {
        return "-";
      }

      const date = value instanceof Date ? value : new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "short",
        timeStyle: "short",
      }).format(date);
    }

    function formatMeasurement(measurement) {
      if (measurement === null || measurement === undefined || measurement === "") {
        return "-";
      }

      if (typeof measurement !== "object") {
        return String(measurement);
      }

      const value = firstValue(measurement.value, measurement.val, measurement.amount);
      if (value === null || value === undefined || value === "") {
        return "-";
      }

      const units = displayValue(firstValue(measurement.units, measurement.unit));
      return units === "-" ? String(value) : `${value} ${units}`;
    }

    function formatTemperature(measurement) {
      const parsed = measurementParts(measurement);
      if (!parsed) {
        return "-";
      }

      return parsed.units === "-" ? `${parsed.value}\u00b0` : `${parsed.value}\u00b0 ${parsed.units}`;
    }

    function formatWind(speedMeasurement, directionMeasurement) {
      const speed = measurementParts(speedMeasurement);
      const direction = formatDirection(directionMeasurement);
      if (!speed && !direction) {
        return "-";
      }
      if (!speed) {
        return renderDirection(direction);
      }
      if (!direction) {
        return escapeHtml(formatMeasurement(speedMeasurement));
      }

      const speedUnits = speed.units === "-" ? "" : ` ${speed.units}`;
      return `${escapeHtml(speed.value)}${escapeHtml(speedUnits)}${renderDirection(direction, true)}`;
    }

    function formatDirection(measurement) {
      if (measurement === null || measurement === undefined || measurement === "") {
        return null;
      }

      const parts = measurementParts(measurement);
      const symbol = typeof measurement === "object"
        ? firstValue(measurement.symbol, measurement.direction_symbol)
        : null;

      if (!parts && !symbol) {
        return null;
      }

      return {
        symbol: symbol ? String(symbol) : "",
        detail: parts ? (parts.units === "-" ? `${parts.value}\u00b0` : `${parts.value}\u00b0 ${parts.units}`) : "",
      };
    }

    function renderDirection(direction, includeLeadingSpace = false) {
      if (!direction) {
        return "-";
      }

      const prefix = includeLeadingSpace ? " " : "";
      const symbol = direction.symbol ? `${prefix}${escapeHtml(direction.symbol)}` : "";
      const detail = direction.detail
        ? `${symbol ? " " : prefix}<span class="wind-detail">(${escapeHtml(direction.detail)})</span>`
        : "";

      return `${symbol}${detail}` || "-";
    }

    function measurementParts(measurement) {
      if (measurement === null || measurement === undefined || measurement === "") {
        return null;
      }

      if (typeof measurement !== "object") {
        return { value: String(measurement), units: "-" };
      }

      const value = firstValue(measurement.value, measurement.val, measurement.amount);
      if (value === null || value === undefined || value === "") {
        return null;
      }

      return {
        value: String(value),
        units: displayValue(firstValue(measurement.units, measurement.unit)),
      };
    }

    function displayValue(value) {
      return value === null || value === undefined || value === "" ? "-" : String(value);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setStatus(message, isError = false) {
      elements.status.textContent = message;
      elements.status.classList.toggle("error", isError);
    }
  </script>
</body>
</html>
