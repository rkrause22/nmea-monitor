<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NMEA Weather Map</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      color: #17212b;
      background: #f4f7f9;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      font-family: inherit;
      color: inherit;
      background: #f4f7f9;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .status {
      position: absolute;
      z-index: 1;
      top: 52px;
      left: 2px;
      max-width: min(420px, calc(100vw - 24px));
      padding: 10px 12px;
      border-radius: 6px;
      background: rgb(23 33 43 / 78%);
      box-shadow: 0 2px 12px rgb(0 0 0 / 18%);
      font-size: 14px;
      line-height: 1.35;
      color: #d9dee5;
    }

    .status[hidden] {
      display: none;
    }

    .status.error {
      color: #a12622;
    }

    .popup-card {
      width: min(320px, calc(100vw - 56px));
      background: #ffffff;
      border: 1px solid #d9dee5;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgb(0 0 0 / 8%);
    }

    .popup-title {
      margin: 0;
      padding: 14px 16px 6px;
      font-size: 19px;
      font-weight: 700;
      line-height: 1.2;
      color: #17212b;
      text-align: left;
    }

    .weather-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .weather-table th,
    .weather-table td {
      padding: 12px 12px;
      border-bottom: 1px solid #d9dee5;
      text-align: left;
      vertical-align: top;
      line-height: 1.35;
    }

    .weather-table tr:last-child th,
    .weather-table tr:last-child td {
      border-bottom: 0;
    }

    .weather-table th {
      width: 48px;
      color: #4c5a67;
      font-weight: 700;
      text-align: center;
    }

    .weather-table .value-cell {
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .time-range-line {
      display: block;
      white-space: nowrap;
    }

    .cell-icon {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
      color: #28758a;
      opacity: 0.86;
    }

    .cell-icon .icon-accent {
      color: #d15f4f;
    }

    .boat-marker {
      width: 30px;
      height: 30px;
      filter: drop-shadow(0 2px 4px rgb(0 0 0 / 28%));
      transform-origin: 50% 50%;
    }

    .boat-marker svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .windward-marker {
      width: 28px;
      height: 28px;
      filter: drop-shadow(0 2px 4px rgb(0 0 0 / 28%));
      transform-origin: 50% 50%;
    }

    .windward-marker svg {
      display: block;
      width: 100%;
      height: 100%;
    }

    .wind-detail {
      color: #d9dee5;
    }

    .gm-style .gm-style-iw-c {
      padding: 0;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgb(0 0 0 / 18%);
    }

    .gm-style .gm-style-iw-d {
      overflow: hidden;
      max-height: none;
    }

    .gm-style .gm-style-iw-chr {
      display: none;
    }

    @media (max-width: 420px) {
      .popup-card {
        width: min(320px, calc(100vw - 36px));
      }

      .weather-table th,
      .weather-table td {
        padding: 10px 8px;
      }

      .weather-table th {
        width: 38px;
      }

      .cell-icon {
        width: 24px;
        height: 24px;
      }
    }
  </style>
</head>
<body>
  <div id="status" class="status">Loading weather data...</div>
  <div id="map"></div>

  <script>
    const REFRESH_INTERVAL_MS = 10000;
    const DEFAULT_VIEW_HEIGHT_METRES = 1000;
    const BARGE_CLICK_RADIUS_METRES = 50;
    const PAGE_QUERY = new URLSearchParams(window.location.search);

    let map;
    let AdvancedMarkerElement;
    let marker;
    let windwardMarker;
    let infoWindow;
    const requestConfig = readRequestConfig();
    let mapsApiLoadStarted = false;
    let lastWeatherPosition = null;
    let lastWindDirection = null;
    let isInfoWindowOpen = true;

    if (!requestConfig.org || !requestConfig.source) {
      document.title = "Weather Map";
      setStatus("Add ?org=<org>&src=<source> to the page URL.", true);
    } else {
      loadMapsApiForOrg();
    }

    window.initMap = async function initMap() {
      try {
        ({ AdvancedMarkerElement } = await google.maps.importLibrary("marker"));
        const weather = await fetchWeather();
        const position = weatherPosition(weather);

        map = new google.maps.Map(document.getElementById("map"), {
          center: position,
          zoom: 18,
          mapTypeId: "hybrid",
          mapId: "DEMO_MAP_ID",
        });

        infoWindow = new google.maps.InfoWindow();
        infoWindow.addListener("closeclick", () => {
          isInfoWindowOpen = false;
        });
        map.addListener("click", handleMapClick);

        renderWeatherOnMap(weather, position, true);
        setInterval(() => {
          refreshWeather(false);
        }, requestConfig.rate);
      } catch (error) {
        setStatus(error.message, true);
      }
    };

    async function refreshWeather(isInitialLoad) {
      try {
        const weather = await fetchWeather();
        const position = weatherPosition(weather);
        renderWeatherOnMap(weather, position, isInitialLoad);
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    function renderWeatherOnMap(weather, position, isInitialLoad) {
      if (!marker) {
        marker = new AdvancedMarkerElement({
          position,
          map,
          title: formatTitle(weather),
          content: buildBoatMarker(directionDegrees(weather.wind_direction)),
          anchorLeft: "-50%",
          anchorTop: "-50%",
          gmpClickable: true,
        });
        marker.addEventListener("gmp-click", (event) => {
          event.domEvent?.stopPropagation();
          toggleInfoWindow();
        });
      } else {
        marker.position = position;
        marker.title = formatTitle(weather);
        marker.content = buildBoatMarker(directionDegrees(weather.wind_direction));
      }

      updateWindwardMarker(weather.windward, {
        rotationDegrees: reverseDirectionDegrees(weather.wind_direction),
        title: "Windward",
      });

      if (isInitialLoad) {
        applyDefaultView(position);
      } else {
        map.panTo(position);
      }

      document.title = popupTitle(weather);
      infoWindow.setContent(renderWeatherCard(weather));
      if (isInfoWindowOpen) {
        openInfoWindow();
      }
      setStatus(`Updated ${formatLocalDateTime(new Date())}`);
    }

    function openInfoWindow() {
      isInfoWindowOpen = true;
      infoWindow.open({ anchor: marker, map });
    }

    function closeInfoWindow() {
      isInfoWindowOpen = false;
      infoWindow.close();
    }

    function toggleInfoWindow() {
      if (isInfoWindowOpen) {
        closeInfoWindow();
      } else {
        openInfoWindow();
      }
    }

    function handleMapClick(event) {
      const clickedPosition = event.latLng
        ? { lat: event.latLng.lat(), lng: event.latLng.lng() }
        : null;
      const bargePosition = positionLiteral(marker?.position);

      if (
        clickedPosition
        && bargePosition
        && distanceMetres(clickedPosition, bargePosition) <= BARGE_CLICK_RADIUS_METRES
      ) {
        openInfoWindow();
        return;
      }

      closeInfoWindow();
    }

    function distanceMetres(left, right) {
      if (
        !Number.isFinite(left.lat)
        || !Number.isFinite(left.lng)
        || !Number.isFinite(right.lat)
        || !Number.isFinite(right.lng)
      ) {
        return Number.POSITIVE_INFINITY;
      }

      const earthRadiusMetres = 6371000;
      const latitudeDelta = degreesToRadians(right.lat - left.lat);
      const longitudeDelta = degreesToRadians(right.lng - left.lng);
      const leftLatitude = degreesToRadians(left.lat);
      const rightLatitude = degreesToRadians(right.lat);
      const haversine = Math.sin(latitudeDelta / 2) ** 2
        + Math.cos(leftLatitude) * Math.cos(rightLatitude)
        * Math.sin(longitudeDelta / 2) ** 2;
      return earthRadiusMetres * 2 * Math.atan2(
        Math.sqrt(haversine),
        Math.sqrt(1 - haversine),
      );
    }

    function positionLiteral(position) {
      if (!position) {
        return null;
      }

      const lat = typeof position.lat === "function" ? position.lat() : Number(position.lat);
      const lng = typeof position.lng === "function" ? position.lng() : Number(position.lng);
      return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;
    }

    function degreesToRadians(value) {
      return value * Math.PI / 180;
    }

    async function fetchWeather() {
      const response = await fetch(weatherUrl(requestConfig), {
        headers: { Accept: "application/json" },
      });
      if (!response.ok) {
        throw new Error(`Weather request failed: HTTP ${response.status}`);
      }
      return weatherWithLastKnownValues(await response.json());
    }

    async function loadMapsApiForOrg() {
      if (mapsApiLoadStarted) {
        return;
      }

      mapsApiLoadStarted = true;

      try {
        const registration = await fetchRegistration(requestConfig.org);
        const gkey = displayValue(registration.gkey);

        if (gkey === "-") {
          throw new Error(`Registration for ${requestConfig.org} does not include a gkey.`);
        }

        setStatus("Loading map...", false);
        await injectGoogleMapsScript(gkey);
      } catch (error) {
        setStatus(error.message, true);
      }
    }

    async function fetchRegistration(org) {
      const response = await fetch(`/nmea/registrations/${encodeURIComponent(org)}`, {
        headers: { Accept: "application/json" },
      });
      if (!response.ok) {
        throw new Error(`Registration request failed: HTTP ${response.status}`);
      }
      return response.json();
    }

    function injectGoogleMapsScript(gkey) {
      return new Promise((resolve, reject) => {
        const script = document.createElement("script");
        script.async = true;
        script.defer = true;
        script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(gkey)}&libraries=marker&loading=async&callback=initMap`;
        script.onerror = () => reject(new Error("Google Maps API failed to load."));
        script.onload = () => resolve();
        document.head.appendChild(script);
      });
    }

    function weatherUrl(config) {
      const params = new URLSearchParams();
      if (config.start) {
        params.set("start", config.start);
      }
      if (config.end) {
        params.set("end", config.end);
      }
      if (config.span) {
        params.set("span", config.span);
      }
      const query = params.size === 0 ? "/3" : `?${params.toString()}`;
      return `/nmea/weather/${encodeURIComponent(config.org)}/${encodeURIComponent(config.source)}${query}`;
    }

    function readRequestConfig() {
      return {
        org: firstQueryValue("org"),
        source: firstQueryValue("src"),
        span: firstQueryValue("span"),
        start: firstQueryValue("start"),
        end: firstQueryValue("end"),
        rate: readRefreshIntervalMs()
      };
    }

    function readRefreshIntervalMs() {
      const value = Number(firstQueryValue("rate"));
      if (!Number.isFinite(value) || value <= 0) {
        return REFRESH_INTERVAL_MS;
      }
      return value * 1000;
    }

    function firstQueryValue(...keys) {
      for (const key of keys) {
        const value = PAGE_QUERY.get(key);
        if (value && value.trim()) {
          return value.trim();
        }
      }
      return "";
    }

    function weatherPosition(weather) {
      const lat = Number(weather.latitude);
      const lng = Number(weather.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        throw new Error("Weather response does not contain a valid latitude/longitude.");
      }
      return { lat, lng };
    }

    function weatherWithLastKnownValues(weather) {
      const restoredWeather = weather && typeof weather === "object" ? { ...weather } : {};

      if (!hasWeatherPosition(restoredWeather) && lastWeatherPosition) {
        restoredWeather.latitude = lastWeatherPosition.lat;
        restoredWeather.longitude = lastWeatherPosition.lng;
      }

      if (!hasWindDirection(restoredWeather.wind_direction) && lastWindDirection !== null) {
        restoredWeather.wind_direction = cloneWeatherValue(lastWindDirection);
      }

      if (hasWeatherPosition(restoredWeather)) {
        lastWeatherPosition = {
          lat: Number(restoredWeather.latitude),
          lng: Number(restoredWeather.longitude),
        };
      }

      if (hasWindDirection(restoredWeather.wind_direction)) {
        lastWindDirection = cloneWeatherValue(restoredWeather.wind_direction);
      }

      return restoredWeather;
    }

    function hasWeatherPosition(weather) {
      if (!weather || typeof weather !== "object") {
        return false;
      }

      return Number.isFinite(Number(weather.latitude)) && Number.isFinite(Number(weather.longitude));
    }

    function hasWindDirection(measurement) {
      return Number.isFinite(Number(windDirectionValue(measurement)));
    }

    function cloneWeatherValue(value) {
      if (!value || typeof value !== "object") {
        return value;
      }

      return JSON.parse(JSON.stringify(value));
    }

    function applyDefaultView(position) {
      const latHalfSpan = DEFAULT_VIEW_HEIGHT_METRES / 2 / 111320;
      const container = document.getElementById("map");
      const width = Math.max(container.clientWidth || 1, 1);
      const height = Math.max(container.clientHeight || 1, 1);
      const aspectRatio = width / height;
      const lngHalfSpan = (latHalfSpan * aspectRatio) / Math.max(Math.cos(position.lat * Math.PI / 180), 0.01);
      const bounds = {
        north: position.lat + latHalfSpan,
        south: position.lat - latHalfSpan,
        east: position.lng + lngHalfSpan,
        west: position.lng - lngHalfSpan,
      };

      map.fitBounds(bounds, 0);
    }

    function optionalPosition(value) {
      if (!value || typeof value !== "object") {
        return null;
      }

      const lat = Number(value.latitude);
      const lng = Number(value.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        return null;
      }

      return { lat, lng };
    }

    function updateWindwardMarker(value, appearance) {
      const position = optionalPosition(value);
      const existingMarker = windwardMarker;

      if (!position) {
        if (existingMarker) {
          existingMarker.map = null;
          windwardMarker = null;
        }
        return;
      }

      if (!existingMarker) {
        const newMarker = new AdvancedMarkerElement({
          position,
          map,
          title: appearance.title,
          content: buildWindwardMarker(appearance.rotationDegrees),
          anchorLeft: "-50%",
          anchorTop: "-50%",
          zIndex: 2,
        });
        windwardMarker = newMarker;
        return;
      }

      existingMarker.position = position;
      existingMarker.title = appearance.title;
      existingMarker.content = buildWindwardMarker(appearance.rotationDegrees);
    }

    function renderWeatherCard(weather) {
      const title = popupTitle(weather);
      return `
        <section class="popup-card" aria-label="Current weather">
          <h2 class="popup-title">${escapeHtml(title)}</h2>
          <table class="weather-table">
            <tbody>
              <tr>
                <th scope="row" aria-label="Local date time">
                  ${clockIcon()}
                </th>
                <td class="value-cell">${renderWeatherTime(weather)}</td>
              </tr>
              <tr>
                <th scope="row" aria-label="Temperature">
                  ${thermometerIcon()}
                </th>
                <td class="value-cell">${escapeHtml(formatTemperature(weather.temperature))}</td>
              </tr>
              <tr>
                <th scope="row" aria-label="Wind">
                  ${windIcon()}
                </th>
                <td class="value-cell">${formatWind(weather.wind_speed, weather.wind_direction)}</td>
              </tr>
            </tbody>
          </table>
        </section>
      `;
    }

    function formatLocalDateTime(value) {
      if (!value) {
        return "-";
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "short",
        timeStyle: "short",
      }).format(date);
    }

    function renderWeatherTime(weather) {
      if (weather.utc_end_time) {
        return `
          ${escapeHtml(formatLocalDateTime(weather.utc_time))} - ${escapeHtml(formatLocalDateTime(weather.utc_end_time))}
        `;
      }

      return escapeHtml(formatLocalDateTime(weather.utc_time));
    }

    function formatMeasurement(measurement) {
      if (!measurement || measurement.value === null || measurement.value === undefined) {
        return "-";
      }

      const value = Number(measurement.value);
      const text = Number.isFinite(value) ? value.toFixed(1) : String(measurement.value);
      return `${text} ${displayValue(measurement.units)}`;
    }

    function formatTemperature(measurement) {
      const parts = measurementParts(measurement);
      if (!parts) {
        return "-";
      }
      return parts.units === "-" ? `${parts.value}\u00b0` : `${parts.value}\u00b0 ${parts.units}`;
    }

    function formatWind(speedMeasurement, directionMeasurement) {
      const speed = measurementParts(speedMeasurement);
      const direction = formatDirection(directionMeasurement);
      if (!speed && !direction) {
        return "-";
      }
      if (!speed) {
        return renderDirection(direction);
      }
      if (!direction) {
        return escapeHtml(formatMeasurement(speedMeasurement));
      }

      const speedUnits = speed.units === "-" ? "" : ` ${speed.units}`;
      return `${escapeHtml(speed.value)}${escapeHtml(speedUnits)}${renderDirection(direction, true)}`;
    }

    function directionDegrees(measurement) {
      const value = Number(windDirectionValue(measurement));
      if (!Number.isFinite(value)) {
        return 0;
      }

      return value;
    }

    function windDirectionValue(measurement) {
      if (measurement === null || measurement === undefined || measurement === "") {
        return null;
      }

      if (typeof measurement !== "object") {
        return measurement;
      }

      return firstValue(measurement.value, measurement.val, measurement.amount);
    }

    function reverseDirectionDegrees(measurement) {
      return (directionDegrees(measurement) + 180) % 360;
    }

    function formatDirection(measurement) {
      if (measurement === null || measurement === undefined || measurement === "") {
        return null;
      }

      const parts = measurementParts(measurement);
      const symbol = typeof measurement === "object"
        ? firstValue(measurement.symbol, measurement.direction_symbol)
        : null;

      if (!parts && !symbol) {
        return null;
      }

      return {
        symbol: symbol ? String(symbol) : "",
        detail: parts ? (parts.units === "-" ? `${parts.value}\u00b0` : `${parts.value}\u00b0 ${parts.units}`) : "",
      };
    }

    function renderDirection(direction, includeLeadingSpace = false) {
      if (!direction) {
        return "-";
      }

      const prefix = includeLeadingSpace ? " " : "";
      const symbol = direction.symbol ? `${prefix}${escapeHtml(direction.symbol)}` : "";
      const detail = direction.detail
        ? `${symbol ? " " : prefix}<span class="wind-detail">(${escapeHtml(direction.detail)})</span>`
        : "";

      return `${symbol}${detail}` || "-";
    }

    function measurementParts(measurement) {
      if (measurement === null || measurement === undefined || measurement === "") {
        return null;
      }

      if (typeof measurement !== "object") {
        return { value: String(measurement), units: "-" };
      }

      const value = firstValue(measurement.value, measurement.val, measurement.amount);
      if (value === null || value === undefined || value === "") {
        return null;
      }

      return {
        value: String(value),
        units: displayValue(firstValue(measurement.units, measurement.unit)),
      };
    }

    function formatTitle(weather) {
      const org = displayValue(weather.org);
      const source = displayValue(weather.source);
      return org === "-" && source === "-" ? "NMEA Weather Data" : `${org} ${source}`;
    }

    function popupTitle(weather) {
      return `Weather at ${formatTitle(weather)}`;
    }

    function firstValue(...values) {
      return values.find((value) => value !== null && value !== undefined && value !== "");
    }

    function clockIcon() {
      return `
        <svg class="cell-icon" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="11" fill="none" stroke="currentColor" stroke-width="2.4"/>
          <path d="M16 9.5v7l5 3" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.2 5.8 6.3 8.4M22.8 5.8l2.9 2.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      `;
    }

    function thermometerIcon() {
      return `
        <svg class="cell-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M14 18.2V7a4 4 0 0 1 8 0v11.2a7 7 0 1 1-8 0Z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/>
          <path class="icon-accent" d="M18 10v11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <circle class="icon-accent" cx="18" cy="23" r="3.2" fill="currentColor"/>
        </svg>
      `;
    }

    function windIcon() {
      return `
        <svg class="cell-icon" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 11h14.5a4 4 0 1 0-3.7-5.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M4 17h20.5a3.5 3.5 0 1 1-3.2 4.9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M4 23h9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      `;
    }

    function buildBoatMarker(rotationDegrees = 0) {
      return htmlToElement(`
        <div class="boat-marker" aria-hidden="true" style="transform: rotate(${escapeHtml(rotationDegrees)}deg);">
          <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 2 L27 11 L27 31 L9 31 L9 11 Z" fill="#28758a" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
            <path d="M18 7 L22.5 12.5 L13.5 12.5 Z" fill="#ffffff" opacity="0.38"/>
            <path d="M12 28.5 H24" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
          </svg>
        </div>
      `);
    }

    function buildWindwardMarker(rotationDegrees = 0) {
      return htmlToElement(`
        <div class="windward-marker" aria-hidden="true" style="transform: rotate(${escapeHtml(rotationDegrees)}deg);">
          <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 3 L30 20 H23 V33 H13 V20 H6 Z" fill="#c7362f" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
            <path d="M18 8 L24 18 H20.5 V29 H15.5 V18 H12 Z" fill="#8f201b" opacity="0.5"/>
          </svg>
        </div>
      `);
    }

    function htmlToElement(html) {
      const template = document.createElement("template");
      template.innerHTML = html.trim();
      return template.content.firstElementChild;
    }

    function displayValue(value) {
      return value === null || value === undefined || value === "" ? "-" : String(value);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setStatus(message, isError = false) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.classList.toggle("error", isError);
      status.hidden = !message;
    }
  </script>
</body>
</html>
