<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Conditions</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      color: #edf3f9;
      background: #090d11;
    }

    * {
      box-sizing: border-box;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090d11;
      color: #edf3f9;
      font-family: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: #121920;
      border-bottom: 1px solid #24313e;
      box-shadow: 0 8px 24px rgb(0 0 0 / 28%);
    }

    .title-block {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #99a7b5;
      font-size: 14px;
      line-height: 1.3;
      white-space: nowrap;
    }

    .nav {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-end;
    }

    .view-select,
    .icon-button {
      min-height: 42px;
      border: 1px solid #324253;
      border-radius: 6px;
      background: #0f161d;
      color: #cfd9e3;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
    }

    .view-select {
      min-width: 156px;
      padding: 9px 36px 9px 12px;
      cursor: pointer;
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      padding: 0;
      cursor: pointer;
      font-size: 27px;
      line-height: 1;
    }

    .view-select:hover,
    .view-select:focus-visible,
    .icon-button:hover,
    .icon-button:focus-visible {
      border-color: #5c738a;
      color: #f5f9fc;
      outline: none;
    }

    .frame-wrap {
      padding: 12px;
    }

    .frame {
      display: block;
      width: 100%;
      min-height: calc(99vh - 99px);
      border: 0;
      border-radius: 6px;
      background: #090d11;
      overflow: hidden;
    }

    .message {
      display: none;
      margin: 48px auto 0;
      max-width: 520px;
      padding: 18px 20px;
      background: #121920;
      border: 1px solid #24313e;
      border-radius: 6px;
      color: #ffb4b4;
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .title {
        font-size: 22px;
      }

      .subtitle {
        white-space: normal;
      }

      .nav {
        width: 100%;
        justify-content: stretch;
      }

      .view-select {
        flex: 1;
        min-width: 0;
      }

      .frame {
        min-height: calc(99vh - 152px);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-block">
        <h1 class="title">Weather Conditions</h1>
        <p id="subtitle" class="subtitle">Awaiting query parameters</p>
      </div>
      <nav class="nav" aria-label="View switcher">
        <label for="view-select" class="sr-only">Display</label>
        <select id="view-select" class="view-select" aria-label="Display"></select>
        <button id="refresh-button" class="icon-button" type="button" title="Refresh page" aria-label="Refresh page">&#x21bb;</button>
      </nav>
    </header>

    <main class="frame-wrap">
      <p id="message" class="message">Add ?org=&lt;org&gt;&amp;src=&lt;source&gt; to the page URL.</p>
      <iframe
        id="content-frame"
        class="frame"
        title="NMEA view"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        scrolling="no"
      ></iframe>
    </main>
  </div>

  <script>
    const PAGE_QUERY = new URLSearchParams(window.location.search);
    const DEFAULT_VIEW = "plot";
    const DISPLAYS = [
      {
        id: "plot",
        label: "Plot",
        frameTitle: "Wind plot",
        url: (config) => nmeaPageUrl("nmea-plot.html", config, { includeHistory: true }),
      },
      {
        id: "map",
        label: "Map",
        frameTitle: "Weather map",
        url: (config) => nmeaPageUrl("nmea-map.html", config),
      },
      {
        id: "cam1",
        label: "Cam1",
        frameTitle: "Camera 1",
        url: () => "https://wsccam.arcsite.ca/cam1/",
      },
    ];

    const elements = {
      subtitle: document.getElementById("subtitle"),
      viewSelect: document.getElementById("view-select"),
      refreshButton: document.getElementById("refresh-button"),
      frame: document.getElementById("content-frame"),
      message: document.getElementById("message"),
    };

    populateDisplayOptions();

    elements.viewSelect.addEventListener("change", () => {
      window.location.href = frameUrl(elements.viewSelect.value, requestConfig);
    });

    elements.refreshButton.addEventListener("click", () => {
      const params = new URLSearchParams();
      params.set("view", displayForId(elements.viewSelect.value).id);
      window.location.assign(`${window.location.pathname}?${params.toString()}`);
    });

    const requestConfig = readRequestConfig();

    if (!requestConfig.org || !requestConfig.source) {
      elements.subtitle.textContent = "Query string required";
      elements.message.classList.add("show");
      elements.frame.style.display = "none";
      selectDisplay(requestConfig.view);
    } else {
      const activeDisplay = displayForId(requestConfig.view);
      const frameTitle = `${requestConfig.org} ${requestConfig.source}`;
      document.title = `Weather Conditions @ ${frameTitle}`;
      elements.subtitle.textContent = frameTitle;
      elements.message.classList.remove("show");
      elements.frame.style.display = "block";
      elements.frame.addEventListener("load", startFrameResizer);
      selectDisplay(activeDisplay.id);
      elements.frame.title = activeDisplay.frameTitle;
      elements.frame.src = activeDisplay.url(requestConfig);
    }

    let frameResizeObserver;
    let frameResizeCleanup;

    function startFrameResizer() {
      if (frameResizeObserver) {
        frameResizeObserver.disconnect();
      }
      if (frameResizeCleanup) {
        frameResizeCleanup();
      }

      let frameWindow;
      let frameDocument;
      try {
        frameWindow = elements.frame.contentWindow;
        frameDocument = elements.frame.contentDocument;
        if (!frameWindow || !frameDocument || !frameDocument.documentElement) {
          return;
        }
      } catch (error) {
        // Cross-origin displays cannot expose their document height.
        return;
      }

      const resizeFrame = () => {
        window.requestAnimationFrame(() => {
          const minHeight = Math.max(320, Math.floor(window.innerHeight * 0.99) - elements.frame.offsetTop - 12);
          const documentElement = frameDocument.documentElement;
          const body = frameDocument.body;
          const contentHeight = Math.max(
            documentElement ? documentElement.scrollHeight : 0,
            documentElement ? documentElement.offsetHeight : 0,
            body ? body.scrollHeight : 0,
            body ? body.offsetHeight : 0,
            minHeight
          );
          elements.frame.style.height = `${contentHeight}px`;
        });
      };

      frameResizeObserver = new ResizeObserver(resizeFrame);
      frameResizeObserver.observe(frameDocument.documentElement);
      if (frameDocument.body) {
        frameResizeObserver.observe(frameDocument.body);
      }
      frameWindow.addEventListener("resize", resizeFrame);
      window.addEventListener("resize", resizeFrame);
      frameResizeCleanup = () => {
        frameWindow.removeEventListener("resize", resizeFrame);
        window.removeEventListener("resize", resizeFrame);
      };

      resizeFrame();
    }

    function populateDisplayOptions() {
      for (const display of DISPLAYS) {
        const option = document.createElement("option");
        option.value = display.id;
        option.textContent = display.label;
        elements.viewSelect.appendChild(option);
      }
    }

    function selectDisplay(view) {
      elements.viewSelect.value = displayForId(view).id;
    }

    function displayForId(view) {
      return DISPLAYS.find((display) => display.id === view) || DISPLAYS.find((display) => display.id === DEFAULT_VIEW);
    }

    function frameUrl(view, config) {
      const params = new URLSearchParams();
      if (config.org) {
        params.set("org", config.org);
      }
      if (config.source) {
        params.set("src", config.source);
      }
      if (config.rate) {
        params.set("rate", config.rate);
      }
      if (config.span) {
        params.set("span", config.span);
      }
      if (config.start) {
        params.set("start", config.start);
      }
      if (config.end) {
        params.set("end", config.end);
      }
      params.set("view", view);
      return `/nmea-frame.html?${params.toString()}`;
    }

    function nmeaPageUrl(page, config, options = {}) {
      const params = new URLSearchParams();
      params.set("org", config.org);
      params.set("src", config.source);
      if (config.rate) {
        params.set("rate", config.rate);
      }
      if (options.includeHistory) {
        if (config.span) {
          params.set("span", config.span);
        }
        if (config.start) {
          params.set("start", config.start);
        }
        if (config.end) {
          params.set("end", config.end);
        }
      }
      return `/${page}?${params.toString()}`;
    }

    function readRequestConfig() {
      return {
        org: firstQueryValue("org"),
        source: firstQueryValue("src", "source"),
        rate: firstQueryValue("rate"),
        span: firstQueryValue("span"),
        start: firstQueryValue("start"),
        end: firstQueryValue("end"),
        view: firstQueryValue("view") || DEFAULT_VIEW,
      };
    }

    function firstQueryValue(...keys) {
      for (const key of keys) {
        const value = PAGE_QUERY.get(key);
        if (value && value.trim()) {
          return value.trim();
        }
      }
      return "";
    }
  </script>
</body>
</html>
