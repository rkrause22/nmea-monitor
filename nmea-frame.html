<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NMEA Frame</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
      color: #edf3f9;
      background: #090d11;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #090d11;
      color: #edf3f9;
      font-family: inherit;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 20px;
      background: #121920;
      border-bottom: 1px solid #24313e;
      box-shadow: 0 8px 24px rgb(0 0 0 / 28%);
    }

    .title-block {
      min-width: 0;
    }

    .title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
    }

    .subtitle {
      margin: 4px 0 0;
      color: #99a7b5;
      font-size: 14px;
      line-height: 1.3;
      white-space: nowrap;
    }

    .nav {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .nav-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 104px;
      padding: 10px 16px;
      border: 1px solid #324253;
      border-radius: 6px;
      background: #0f161d;
      color: #cfd9e3;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      line-height: 1;
      white-space: nowrap;
    }

    .nav-link.active {
      background: #1a2632;
      border-color: #5c738a;
      color: #f5f9fc;
    }

    .frame-wrap {
      padding: 12px;
    }

    .frame {
      display: block;
      width: 100%;
      min-height: calc(99vh - 99px);
      border: 0;
      border-radius: 6px;
      background: #090d11;
      overflow: hidden;
    }

    .message {
      display: none;
      margin: 48px auto 0;
      max-width: 520px;
      padding: 18px 20px;
      background: #121920;
      border: 1px solid #24313e;
      border-radius: 6px;
      color: #ffb4b4;
      font-size: 16px;
      line-height: 1.4;
      text-align: center;
    }

    .message.show {
      display: block;
    }

    @media (max-width: 760px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .title {
        font-size: 22px;
      }

      .subtitle {
        white-space: normal;
      }

      .nav {
        width: 100%;
        justify-content: flex-start;
      }

      .frame {
        min-height: calc(99vh - 152px);
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="title-block">
        <h1 class="title">NMEA Display</h1>
        <p id="subtitle" class="subtitle">Awaiting query parameters</p>
      </div>
      <nav class="nav" aria-label="View switcher">
        <a id="plot-link" class="nav-link" href="#">Polar Plot</a>
        <a id="map-link" class="nav-link" href="#">Map</a>
        <button id="refresh-button" class="nav-link" type="button">Refresh</button>
      </nav>
    </header>

    <main class="frame-wrap">
      <p id="message" class="message">Add ?org=&lt;org&gt;&amp;src=&lt;source&gt; to the page URL.</p>
      <iframe
        id="content-frame"
        class="frame"
        title="NMEA view"
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin"
        scrolling="no"
      ></iframe>
    </main>
  </div>

  <script>
    const PAGE_QUERY = new URLSearchParams(window.location.search);
    const DEFAULT_VIEW = "plot";

    const elements = {
      subtitle: document.getElementById("subtitle"),
      plotLink: document.getElementById("plot-link"),
      mapLink: document.getElementById("map-link"),
      refreshButton: document.getElementById("refresh-button"),
      frame: document.getElementById("content-frame"),
      message: document.getElementById("message"),
    };

    elements.refreshButton.addEventListener("click", () => {
      window.location.reload();
    });

    const requestConfig = readRequestConfig();

    if (!requestConfig.org || !requestConfig.source) {
      elements.subtitle.textContent = "Query string required";
      elements.message.classList.add("show");
      elements.frame.style.display = "none";
      configureNav(DEFAULT_VIEW, requestConfig);
    } else {
      const activeView = requestConfig.view === "map" ? "map" : "plot";
      const frameTitle = `${requestConfig.org} ${requestConfig.source}`;
      document.title = `NMEA Frame ${frameTitle}`;
      elements.subtitle.textContent = frameTitle;
      elements.message.classList.remove("show");
      elements.frame.style.display = "block";
      elements.frame.addEventListener("load", startFrameResizer);
      configureNav(activeView, requestConfig);
      elements.frame.src = subpageUrl(activeView, requestConfig);
    }

    let frameResizeObserver;
    let frameResizeCleanup;

    function startFrameResizer() {
      if (frameResizeObserver) {
        frameResizeObserver.disconnect();
      }
      if (frameResizeCleanup) {
        frameResizeCleanup();
      }

      const frameWindow = elements.frame.contentWindow;
      const frameDocument = elements.frame.contentDocument;
      if (!frameWindow || !frameDocument) {
        return;
      }

      const resizeFrame = () => {
        window.requestAnimationFrame(() => {
          const minHeight = Math.max(320, Math.floor(window.innerHeight * 0.99) - elements.frame.offsetTop - 12);
          const documentElement = frameDocument.documentElement;
          const body = frameDocument.body;
          const contentHeight = Math.max(
            documentElement ? documentElement.scrollHeight : 0,
            documentElement ? documentElement.offsetHeight : 0,
            body ? body.scrollHeight : 0,
            body ? body.offsetHeight : 0,
            minHeight
          );
          elements.frame.style.height = `${contentHeight}px`;
        });
      };

      frameResizeObserver = new ResizeObserver(resizeFrame);
      frameResizeObserver.observe(frameDocument.documentElement);
      if (frameDocument.body) {
        frameResizeObserver.observe(frameDocument.body);
      }
      frameWindow.addEventListener("resize", resizeFrame);
      window.addEventListener("resize", resizeFrame);
      frameResizeCleanup = () => {
        frameWindow.removeEventListener("resize", resizeFrame);
        window.removeEventListener("resize", resizeFrame);
      };

      resizeFrame();
    }

    function configureNav(activeView, config) {
      const plotHref = frameUrl("plot", config);
      const mapHref = frameUrl("map", config);

      elements.plotLink.href = plotHref;
      elements.mapLink.href = mapHref;
      elements.plotLink.classList.toggle("active", activeView === "plot");
      elements.mapLink.classList.toggle("active", activeView === "map");
    }

    function frameUrl(view, config) {
      const params = new URLSearchParams();
      if (config.org) {
        params.set("org", config.org);
      }
      if (config.source) {
        params.set("src", config.source);
      }
      if (config.rate) {
        params.set("rate", config.rate);
      }
      if (config.span) {
        params.set("span", config.span);
      }
      params.set("view", view);
      return `/nmea-frame.html?${params.toString()}`;
    }

    function subpageUrl(view, config) {
      const params = new URLSearchParams();
      params.set("org", config.org);
      params.set("src", config.source);
      if (config.rate) {
        params.set("rate", config.rate);
      }
      if (view === "plot" && config.span) {
        params.set("span", config.span);
      }
      return `/${view === "map" ? "nmea-map.html" : "nmea-plot.html"}?${params.toString()}`;
    }

    function readRequestConfig() {
      return {
        org: firstQueryValue("org"),
        source: firstQueryValue("src", "source"),
        rate: firstQueryValue("rate"),
        span: firstQueryValue("span"),
        view: firstQueryValue("view") || DEFAULT_VIEW,
      };
    }

    function firstQueryValue(...keys) {
      for (const key of keys) {
        const value = PAGE_QUERY.get(key);
        if (value && value.trim()) {
          return value.trim();
        }
      }
      return "";
    }
  </script>
</body>
</html>
