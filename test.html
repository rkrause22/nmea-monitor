<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NMEA Weather Map Test</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #17212b;
    }

    #map {
      height: 100%;
      width: 100%;
    }

    .status {
      position: absolute;
      z-index: 1;
      top: 12px;
      left: 12px;
      max-width: min(420px, calc(100vw - 24px));
      padding: 10px 12px;
      border-radius: 6px;
      background: #ffffff;
      box-shadow: 0 2px 12px rgb(0 0 0 / 18%);
      font-size: 14px;
      line-height: 1.35;
    }

    .status[hidden] {
      display: none;
    }

    .weather-table {
      border-collapse: collapse;
      min-width: 280px;
      font-size: 14px;
    }

    .weather-table th,
    .weather-table td {
      padding: 7px 9px;
      border-bottom: 1px solid #d9dee5;
      text-align: left;
      vertical-align: top;
    }

    .weather-table tr:last-child th,
    .weather-table tr:last-child td {
      border-bottom: 0;
    }

    .weather-table th {
      width: 48%;
      color: #4c5a67;
      font-weight: 700;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="status" class="status">Loading weather data...</div>
  <div id="map"></div>

  <script>
    const WEATHER_URL = "http://127.0.0.1:5000/nmea/weather/wsc/barge";
    const DEFAULT_LOCATION = { lat: 0, lng: 0 };

    let map;
    let marker;
    let infoWindow;

    window.initMap = async function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: DEFAULT_LOCATION,
        zoom: 3,
        mapTypeId: "hybrid",
      });

      infoWindow = new google.maps.InfoWindow();

      try {
        const weather = await fetchWeather();
        const position = weatherPosition(weather);

        map.setCenter(position);
        map.setZoom(13);

        marker = new google.maps.Marker({
          position,
          map,
          title: `${weather.org ?? ""} / ${weather.source ?? ""}`.trim(),
        });

        infoWindow.setContent(renderWeatherTable(weather));
        infoWindow.open({ anchor: marker, map });
        marker.addListener("click", () => infoWindow.open({ anchor: marker, map }));
        setStatus("");
      } catch (error) {
        setStatus(error.message);
      }
    };

    async function fetchWeather() {
      const response = await fetch(WEATHER_URL, {
        headers: { Accept: "application/json" },
      });
      if (!response.ok) {
        throw new Error(`Weather request failed: HTTP ${response.status}`);
      }
      return response.json();
    }

    function weatherPosition(weather) {
      const lat = Number(weather.latitude);
      const lng = Number(weather.longitude);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) {
        throw new Error("Weather response does not contain a valid latitude/longitude.");
      }
      return { lat, lng };
    }

    function renderWeatherTable(weather) {
      const localTime = formatLocalDateTime(weather.utc_time);
      const orgSource = `${displayValue(weather.org)} / ${displayValue(weather.source)}`;
      const rows = [
        [orgSource, localTime],
        ["Current tempurature", formatMeasurement(weather.temperature)],
        ["Wind Direction", formatMeasurement(weather.wind_direction)],
        ["Wind Strength", formatMeasurement(weather.wind_speed)],
      ];

      return `
        <table class="weather-table">
          <tbody>
            ${rows.map(([label, value]) => `
              <tr>
                <th>${escapeHtml(label)}</th>
                <td>${escapeHtml(value)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    function formatLocalDateTime(value) {
      if (!value) {
        return "-";
      }

      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return "-";
      }

      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "short",
        timeStyle: "short",
      }).format(date);
    }

    function formatMeasurement(measurement) {
      if (!measurement || measurement.value === null || measurement.value === undefined) {
        return "-";
      }

      const value = Number(measurement.value);
      const text = Number.isFinite(value) ? value.toFixed(1) : String(measurement.value);
      return `${text} ${displayValue(measurement.units)}`;
    }

    function displayValue(value) {
      return value === null || value === undefined || value === "" ? "-" : String(value);
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function setStatus(message) {
      const status = document.getElementById("status");
      status.textContent = message;
      status.hidden = !message;
    }
  </script>

  <script
    async
    defer
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&callback=initMap">
  </script>
</body>
</html>
